  name: Veracode Static Analysis

  "on":
    push:
      branches: [ main, master ]
    workflow_dispatch:

  jobs:
    veracode-scan:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Java 11
          uses: actions/setup-java@v4
          with:
            java-version: '11'
            distribution: 'temurin'

        - name: Pin maven-antrun-plugin to compatible version
          run: >-
            sed -i
            's|<artifactId>maven-antrun-plugin</artifactId>|<artifactId>maven-antrun-plugin</artifactId><version>1.8</version>|'
            pom.xml

        - name: Build with Maven
          run: mvn clean package -DskipTests

        - name: Upload and Scan with Veracode
          uses: veracode/uploadandscan-action@v0.1.9
          with:
            appname: 'easybuggy-vulnerable-application'
            version: '${{ github.run_number }}'
            createprofile: false
            filepath: 'target/ROOT.war'
            vid: ${{ secrets.VERACODE_API_ID }}
            vkey: ${{ secrets.VERACODE_API_KEY }}
